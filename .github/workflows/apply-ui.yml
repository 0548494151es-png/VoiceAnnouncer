name: Apply UI

# מריצים פעם אחת ידנית: Actions > Apply UI > Run workflow
# מוסיף: כרטיס "הקראת מסך" עם מתג להסרת העיגול הצף, ורשימת האפליקציות הנוספות מקופלת מאחורי כפתור.
# אם הקוד בריפו שונה ממה שצפוי, הפעולה נעצרת בלי לשנות כלום.
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply patch
        run: |
          set -e
          echo '' | base64 -d > /tmp/patch_ui.py
          python3 /tmp/patch_ui.py

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "אין שינויים"
          else
            git commit -m "מתג לכפתור הקראת מסך ורשימת אפליקציות מקופלת"
            git push origin HEAD:main
          fi

      - name: Start build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run "Build APK" --ref main
