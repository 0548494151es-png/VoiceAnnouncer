      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "אין שינויים"
          else
            git commit -m "שדרוג הכרזת שיחות: חזרות, מרווח, מהירות, נוסח, השתקת צלצול; הסרת טלגרם"
            git push origin HEAD:main
          fi

      # דחיפה שנעשית ע"י התהליך עצמו לא מפעילה בנייה אוטומטית, אז מפעילים אותה ידנית
      - name: Start build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run "Build APK" --ref main
