name: Apply Volume

# מריצים פעם אחת ידנית: Actions > Apply Volume > Run workflow
# מוסיף בהגדרות שני סליידרים: עוצמת ההקראה ועוצמת הצלצול בשיחה נכנסת.
# אם הקוד בריפו שונה ממה שצפוי, הפעולה נעצרת בלי לשנות כלום.
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply patch
        run: |
          set -e
          echo '' | base64 -d > /tmp/patch_volume.py
          python3 /tmp/patch_volume.py

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "אין שינויים"
          else
            git commit -m "סליידרים להגדרות: עוצמת הקראה ועוצמת צלצול בשיחה"
            git push origin HEAD:main
          fi

      - name: Start build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run "Build APK" --ref main
