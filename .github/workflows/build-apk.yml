name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# נדרש כדי שהתהליך יוכל לפרסם Release עם קובץ ה-APK
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build release APK
        run: gradle :app:assembleRelease -Pvc=${{ github.run_number }} --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk VoiceAnnouncer.apk

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoiceAnnouncer-apk
          path: VoiceAnnouncer.apk

      # זה מה שמאפשר עדכון מתוך האפליקציה: כל בנייה מפורסמת כ-Release עם מספר גרסה עולה
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: VoiceAnnouncer v${{ github.run_number }}
          files: VoiceAnnouncer.apk
