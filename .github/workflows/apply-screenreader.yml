name: Apply Screen Reader

# מריצים פעם אחת ידנית: Actions > Apply Screen Reader > Run workflow
# מוסיף לאפליקציה את הקראת המסך (כפתור צף + תרגום מאנגלית), בלי לגעת בשאר הקבצים.
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write new files
        run: |
          set -e
          KT_DIR=$(dirname "$(find app/src/main -name MainActivity.kt | head -n1)")
          if [ -z "$KT_DIR" ] || [ "$KT_DIR" = "." ]; then KT_DIR=app/src/main/java/com/voiceannouncer/app; fi
          RES_DIR=$(dirname "$(dirname "$(find app/src/main -name strings.xml | head -n1)")")
          if [ -z "$RES_DIR" ] || [ "$RES_DIR" = "." ]; then RES_DIR=app/src/main/res; fi
          mkdir -p "$KT_DIR" "$RES_DIR/values" "$RES_DIR/xml"
          echo "Kotlin dir: $KT_DIR"
          echo "Res dir: $RES_DIR"
