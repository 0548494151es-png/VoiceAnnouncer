      - name: Register service and screen in the manifest
        run: |
          set -e
          MANIFEST=$(find app/src/main -name AndroidManifest.xml | head -n1)
          echo "Manifest: $MANIFEST"
          python3 - "$MANIFEST" <<'PY'
          import sys
          p = sys.argv[1]
          s = open(p, encoding="utf-8").read()
          if "ScreenReaderService" in s:
              print("already patched")
          else:
              block = '''
              <!-- הקראת מסך בלחיצה על כפתור צף (שירות נגישות) -->
              <service
                  android:name=".ScreenReaderService"
                  android:exported="true"
                  android:label="@string/sr_service_label"
                  android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                  <intent-filter>
                      <action android:name="android.accessibilityservice.AccessibilityService" />
                  </intent-filter>
                  <meta-data
                      android:name="android.accessibilityservice"
                      android:resource="@xml/screen_reader_accessibility" />
              </service>

              <!-- מסך הגדרות הקראת המסך (אייקון נפרד) -->
              <activity
                  android:name=".ScreenReaderSettingsActivity"
                  android:exported="true"
                  android:label="@string/sr_activity_label">
                  <intent-filter>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent-filter>
              </activity>
          '''
              assert "</application>" in s, "no </application> in manifest"
              s = s.replace("</application>", block + "    </application>", 1)
              open(p, "w", encoding="utf-8").write(s)
              print("patched")
          PY
          grep -c "ScreenReaderService" "$MANIFEST"

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "אין שינויים"
          else
            git commit -m "הקראת מסך: כפתור צף + תרגום מאנגלית"
            git push origin HEAD:main
          fi

      - name: Start build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run "Build APK" --ref main
